<div class="animate-fade-in min-h-screen bg-app-bg text-app-text flex flex-col justify-between font-sans">

  <!-- Header Simplificado de Login -->
  <header class="w-full bg-app-surface border-b border-app-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

      <!-- Logo y Nombre de la Fundación -->
      <a href="https://www.palliri.org/" class="flex items-center space-x-3 group cursor-pointer">
        <div class="flex items-center gap-3">
          <!-- LOGO MODO CLARO (se oculta cuando .dark está activo) -->
          <div class="flex items-center px-2 justify-center h-10 overflow-hidden rounded-xl dark:hidden">
            <img src="/logo_palliri.png" alt="Logo Fundación Palliri" class="w-full h-full object-contain" />
          </div>

          <!-- LOGO MODO OSCURO (oculto por defecto, se muestra como 'flex' cuando .dark está activo) -->
          <div class="hidden dark:flex items-center px-2 justify-center h-10 overflow-hidden rounded-xl">
            <img src="/logo_palliri_dark.png" alt="Logo Fundación Palliri Modo Oscuro"
                 class="w-full h-full object-contain" />
          </div>
        </div>
      </a>

      <!-- Botón Modo Oscuro -->
      <app-theme-toggle></app-theme-toggle>

    </div>
  </header>

  <!-- Contenido Principal: Formulario de Login -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md">

      <!-- Tarjeta Contenedora -->
      <div class="bg-app-surface rounded-3xl border border-app-border shadow-xl p-8 space-y-6 relative overflow-hidden">

        <!-- Línea Decorativa Superior -->
        <div
          class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-brand-secondary via-brand-primary to-brand-secondary"></div>

        <!-- Encabezado del Formulario -->
        <div class="text-center space-y-2">
          <div
            class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-primary text-white font-black text-2xl shadow-lg shadow-brand-primary/20 mb-2">
            FP
          </div>
          <h1 class="text-2xl font-black tracking-tight text-app-text">
            Iniciar Sesión
          </h1>
          <p class="text-xs text-app-text-muted">
            Acceso exclusivo para personal administrativo y operativo
          </p>
        </div>

        <!-- Formulario de Login -->
        <div class="space-y-4">

          <!-- Campo: Correo Electrónico -->
          <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-app-text">
              Correo Electrónico
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-app-text-muted">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                </svg>
              </div>
              <input
                type="email"
                name="email"
                required
                placeholder="usuario@palliri.org"
                class="w-full pl-10 pr-4 py-3 rounded-xl bg-app-bg border border-app-border text-app-text placeholder-app-text-muted focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-colors text-sm font-medium">
            </div>
          </div>

          <!-- Campo: Contraseña -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-bold uppercase tracking-wider text-app-text">
                Contraseña
              </label>
              <a href="#"
                 class="text-xs font-semibold text-brand-primary hover:text-brand-primary-hover transition-colors">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-app-text-muted">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input
                type="password"
                name="password"
                required
                placeholder="••••••••"
                class="w-full pl-10 pr-10 py-3 rounded-xl bg-app-bg border border-app-border text-app-text placeholder-app-text-muted focus:outline-none focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-colors text-sm font-medium">

              <!-- Botón Mostrar/Ocultar Contraseña -->
              <button
                type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-app-text-muted hover:text-app-text cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>

          <!-- Opción: Recordar Sesión -->
          <div class="flex items-center pt-1">
            <input
              id="remember"
              type="checkbox"
              name="remember"
              class="w-4 h-4 rounded border-app-border text-brand-primary focus:ring-brand-primary bg-app-bg cursor-pointer">
            <label for="remember" class="ml-2 block text-xs font-medium text-app-text-muted cursor-pointer">
              Recordar credenciales en este equipo
            </label>
          </div>

          <!-- Botón de Entrar -->
          <button
            (click)="ingresarSistema()"
            class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-brand-primary hover:bg-brand-primary-hover transition-all shadow-md shadow-brand-primary/20 active:scale-[0.99] flex items-center justify-center cursor-pointer mt-4">
            <span>Ingresar al Sistema</span>
          </button>

        </div>

      </div>

      <!-- Pie del Formulario -->
      <p class="text-center text-xs text-app-text-muted mt-6">
        ¿Problemas para acceder? Contacte a
        <a href="mailto:soporte@palliri.org" class="font-bold text-app-text hover:underline">Soporte Técnico</a>
      </p>

    </div>
  </main>

  <!-- Botones de Prueba (Alineados al tema de la aplicación) -->
  <div class="p-8 flex items-center justify-center gap-4">
    <button (click)="guardar()"
            class="px-4 py-2 bg-brand-secondary text-white font-medium rounded-lg hover:opacity-90 transition-opacity">
      Guardar
    </button>
    <button (click)="advertir()"
            class="px-4 py-2 bg-brand-primary text-white font-medium rounded-lg hover:bg-brand-primary-hover transition-colors">
      Advertencia
    </button>
    <button (click)="eliminar()"
            class="px-4 py-2 bg-rose-600 text-white font-medium rounded-lg hover:bg-rose-700 transition-colors">
      Eliminar
    </button>
  </div>

  <!-- Footer Simplificado -->
  <footer class="w-full bg-app-surface border-t border-app-border py-4 text-center">
    <p class="text-xs text-app-text-muted">
      © 2026 Fundación Palliri. Sistema Unificado de Gestión de Infancia.
    </p>
  </footer>

</div>
