<div
  class="min-h-screen bg-slate-50 dark:bg-black text-slate-900 dark:text-slate-100 flex flex-col justify-between font-sans">

  <!-- Header Simplificado de Login -->
  <header class="w-full bg-white dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

      <!-- Logo y Nombre de la Fundación -->
      <a href="/" class="flex items-center space-x-3 group cursor-pointer">
        <div
          class="w-11 h-11 rounded-xl bg-black text-white font-black text-xl flex items-center justify-center border-2 border-orange-500 shadow-sm group-hover:scale-105 transition-transform">
          FP
        </div>
        <div>
          <span class="text-xl font-black tracking-tight text-black dark:text-white block leading-none">
            Fundación <span class="text-orange-500">Palliri</span>
          </span>
          <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider block mt-1">
            Sistema Unificado de Gestión
          </span>
        </div>
      </a>

      <!-- Botón Modo Oscuro -->
      <button
        type="button"
        class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-900 transition-colors border border-slate-200 dark:border-slate-800 cursor-pointer"
        aria-label="Alternar modo oscuro">
        <!-- Ícono Sol / Luna -->
        <svg class="w-5 h-5 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
      </button>

    </div>
  </header>

  <!-- Contenido Principal: Formulario de Login -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md">

      <!-- Tarjeta Contenedora -->
      <div
        class="bg-white dark:bg-slate-950 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-xl p-8 space-y-6 relative overflow-hidden">

        <!-- Línea Decorativa Superior -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-black via-orange-500 to-black"></div>

        <!-- Encabezado del Formulario -->
        <div class="text-center space-y-2">
          <div
            class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-orange-500 text-white font-black text-2xl shadow-lg shadow-orange-500/20 mb-2">
            FP
          </div>
          <h1 class="text-2xl font-black tracking-tight text-black dark:text-white">
            Iniciar Sesión
          </h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">
            Acceso exclusivo para personal administrativo y operativo
          </p>
        </div>

        <!-- Formulario de Login -->
        <form class="space-y-4">

          <!-- Campo: Correo Electrónico -->
          <div class="space-y-1.5">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">
              Correo Electrónico
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                </svg>
              </div>
              <input
                type="email"
                name="email"
                required
                placeholder="usuario@palliri.org"
                class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors text-sm font-medium">
            </div>
          </div>

          <!-- Campo: Contraseña -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                Contraseña
              </label>
              <a href="#" class="text-xs font-semibold text-orange-500 hover:text-orange-600 transition-colors">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
              <input
                type="password"
                name="password"
                required
                placeholder="••••••••"
                class="w-full pl-10 pr-10 py-3 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500 transition-colors text-sm font-medium">

              <!-- Botón Mostrar/Ocultar Contraseña -->
              <button
                type="button"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>

          <app-icono [nombreIcono]="'ojoDesactivado'" [isBordered]="true"></app-icono>

          <!-- Opción: Recordar Sesión -->
          <div class="flex items-center pt-1">
            <input
              id="remember"
              type="checkbox"
              name="remember"
              class="w-4 h-4 rounded border-slate-300 text-orange-500 focus:ring-orange-500 dark:bg-slate-900 dark:border-slate-800 cursor-pointer">
            <label for="remember"
                   class="ml-2 block text-xs font-medium text-slate-600 dark:text-slate-400 cursor-pointer">
              Recordar credenciales en este equipo
            </label>
          </div>

          <!-- Botón de Entrar -->
          <button
            type="submit"
            class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-orange-500 hover:bg-orange-600 transition-all shadow-md shadow-orange-500/20 active:scale-[0.99] flex items-center justify-center cursor-pointer mt-4">
            <span>Ingresar al Sistema</span>
          </button>

        </form>

      </div>

      <!-- Pie del Formulario -->
      <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
        ¿Problemas para acceder? Contacte a
        <a href="mailto:soporte@palliri.org" class="font-bold text-black dark:text-white hover:underline">Soporte
          Técnico</a>
      </p>

    </div>
  </main>

  <div class="p-8 space-y-4">
    <button (click)="guardar()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Guardar</button>
    <button (click)="advertir()" class="px-4 py-2 bg-amber-500 text-white rounded-lg">Advertencia</button>
    <button (click)="eliminar()" class="px-4 py-2 bg-rose-600 text-white rounded-lg">Eliminar</button>
  </div>

  <app-theme-toggle></app-theme-toggle>



  <!-- Footer Simplificado -->
  <footer class="w-full bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 py-4 text-center">
    <p class="text-xs text-slate-500 dark:text-slate-400">
      © 2026 Fundación Palliri. Sistema Unificado de Gestión de Infancia.
    </p>
  </footer>

</div>
